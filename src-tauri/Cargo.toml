[package]
name = "yones"
version = "0.1.0"
description = "Yones IDE — desktop code editor with embedded AI agent"
authors = ["sigmov88-dot"]
edition = "2021"

[lib]
name = "yones_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2.0"
ignore = "0.4"
regex = "1.11"
keyring = "3.6"
tempfile = "3.17"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
